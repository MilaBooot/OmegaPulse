name: Monitor tests
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main, feat/oma-monitor]
permissions:
  contents: read
jobs:
  tests:
    name: Python ${{ matrix.python }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: monitor/requirements*.txt
      - run: python -m pip install -r monitor/requirements-dev.txt
      - run: python -m pytest monitor/tests -q -m 'not integration'
      - run: bash -n monitor/scripts/live.sh monitor/scripts/falco.sh
  unit-tests:
    name: monitor-unit-tests
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all Python versions to pass
        env:
          TEST_RESULT: ${{ needs.tests.result }}
        run: test "$TEST_RESULT" = success
