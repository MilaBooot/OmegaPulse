<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Oma monitor</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='monitor.css') }}">
</head>
<body><main>
  <h1>Sign in to Oma monitor</h1>
  {% if error %}<p role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <p><label>Username <input name="username" autocomplete="username" maxlength="64" required></label></p>
    <p><label>Password <input name="password" type="password" autocomplete="current-password" maxlength="1024" required></label></p>
    <p><label>Authenticator code (if enabled) <input name="otp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6"></label></p>
    <button type="submit">Sign in</button>
  </form>
</main></body>
</html>
